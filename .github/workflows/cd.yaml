name: CD - Deploy to Kubernetes

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Get tag
        run: echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - name: Update image in manifest
        run: |
          sed -i "s|IMAGE_TAG|${TAG}|g" k8s/app-deployment.yaml

      - name: Deploy to Kubernetes
        run: kubectl apply -f k8s/

      - name: Wait rollout
        run: kubectl rollout status deployment/app-deployment -n my-app --timeout=120s

      - name: Telegram notify
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 Deploy successful: $TAG"
